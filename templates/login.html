<!DOCTYPE html>
<html>
<head><title>Komits - Вход</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial}
.container{background:#16213e;padding:40px;border-radius:20px;width:90%;max-width:400px;border:1px solid #2a2a4a}
h1{text-align:center;color:#e0e0e0;margin-bottom:30px}
h1 span{background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
input{width:100%;padding:15px;margin:10px 0;background:#1a1a2e;border:2px solid #2a2a4a;border-radius:12px;color:#e0e0e0;font-size:16px}
button{width:100%;padding:15px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer}
a{color:#667eea;text-decoration:none}
.flash{background:#ff6b6b;color:#fff;padding:12px;border-radius:12px;margin-bottom:15px;text-align:center}
.link{text-align:center;margin-top:20px;color:#999}
</style>
</head>
<body>
<div class="container">
<h1>Komits<span>.</span></h1>
{% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}{% endwith %}
<form method="POST">
<input type="text" name="username" placeholder="👤 Юзернейм" required>
<input type="password" name="password" placeholder="🔒 Пароль" required>
<button type="submit"><i class="fas fa-sign-in-alt"></i> Войти</button>
</form>
<div class="link">Нет аккаунта? <a href="/register">Зарегистрироваться</a></div>
</div>
</body>
</html>
