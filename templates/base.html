<!DOCTYPE html>
<html>
<head>
    <title>Komits</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a0a;--card:#16161a;--border:#2a2a2e;--text:#e8e8e8;--text-muted:#88888d;--accent:#7c5cbf;--accent2:#5b3e8a;--radius:16px}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding:0;padding-bottom:70px;line-height:1.5}
        .container{max-width:600px;margin:0 auto;padding:0 12px}
        .header{background:var(--card);padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
        .header h2{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header-actions{display:flex;gap:12px;align-items:center}
        .header-actions a{color:var(--text);text-decoration:none;font-size:20px;opacity:0.8}
        .header-actions a:hover{opacity:1}
        .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid var(--border);transition:0.2s}
        .card:hover{border-color:var(--accent)}
        .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border:none;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;transition:0.3s;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
        .btn:hover{transform:scale(1.02);opacity:0.9}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
        .btn-outline:hover{border-color:var(--accent);background:rgba(124,92,191,0.1)}
        .btn-danger{background:linear-gradient(135deg,#e74c3c,#c0392b)}
        .btn-success{background:linear-gradient(135deg,#2ecc71,#27ae60)}
        input,textarea{width:100%;padding:12px 16px;background:#1a1a1e;border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-family:inherit;transition:0.3s}
        input:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(124,92,191,0.2)}
        .nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid var(--border);z-index:100}
        .nav a{text-decoration:none;color:var(--text-muted);font-size:22px;padding:4px 12px;border-radius:12px;transition:0.3s}
        .nav a.active{color:var(--accent);background:rgba(124,92,191,0.15)}
        .nav a:hover{color:var(--text)}
        .avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--accent),var(--accent2));display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:white;flex-shrink:0;overflow:hidden}
        .avatar-sm{width:32px;height:32px;font-size:14px}
        .avatar-lg{width:80px;height:80px;font-size:32px}
        .post-image{width:100%;border-radius:12px;margin:10px 0;max-height:400px;object-fit:cover}
        .comment{background:#1a1a1e;padding:10px 14px;border-radius:12px;margin:6px 0;border:1px solid var(--border)}
        .comment .username{color:var(--accent);font-weight:600}
        .flash{background:#e74c3c;color:white;padding:12px;border-radius:12px;margin-bottom:12px;text-align:center}
        .flash-success{background:#2ecc71}
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-track{background:var(--bg)}
        ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px}
        .fade-in{animation:fadeIn 0.3s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    </style>
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, msg in messages %}
                <div class="flash {% if category == 'success' %}flash-success{% endif %}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <div class="nav">
        <a href="/" class="{% if request.path == '/' %}active{% endif %}"><i class="fas fa-home"></i></a>
        <a href="/chats" class="{% if request.path == '/chats' %}active{% endif %}"><i class="fas fa-comments"></i></a>
        <a href="/friends" class="{% if request.path == '/friends' %}active{% endif %}"><i class="fas fa-user-friends"></i></a>
        <a href="/leaderboard" class="{% if request.path == '/leaderboard' %}active{% endif %}"><i class="fas fa-trophy"></i></a>
        <a href="/best_commentator" class="{% if request.path == '/best_commentator' %}active{% endif %}"><i class="fas fa-crown"></i></a>
        <a href="/profile" class="{% if request.path == '/profile' %}active{% endif %}"><i class="fas fa-user"></i></a>
    </div>
</body>
</html>
