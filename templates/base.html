<!DOCTYPE html>
<html>
<head>
    <title>Komits</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial;background:#0a0a0a;color:white;padding:16px;padding-bottom:80px}
        .container{max-width:600px;margin:0 auto}
        .header{background:linear-gradient(135deg,#667eea,#764ba2);padding:16px;border-radius:16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
        .header a{color:white;text-decoration:none;margin-left:15px}
        .card{background:#16213e;padding:16px;border-radius:16px;margin-bottom:16px;border:1px solid #2a2a4a}
        .btn{background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;padding:10px 20px;border-radius:12px;cursor:pointer;display:inline-block;text-decoration:none}
        input,textarea{width:100%;padding:12px;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;color:white}
        .nav{position:fixed;bottom:0;left:0;right:0;background:#1a1a2e;display:flex;justify-content:space-around;padding:12px;border-top:1px solid #2a2a4a}
        .nav a{color:#666;text-decoration:none;font-size:24px;padding:8px 16px;border-radius:12px}
        .nav a.active{color:#667eea;background:rgba(102,126,234,0.15)}
        .flash{background:#ff6b6b;padding:12px;border-radius:12px;margin-bottom:16px;text-align:center}
        .flash-success{background:#51cf66}
        .avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#667eea,#764ba2);display:inline-flex;align-items:center;justify-content:center;font-weight:bold;color:white}
        .avatar-lg{width:80px;height:80px;font-size:32px}
        img{max-width:100%;border-radius:8px}
    </style>
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, msg in messages %}
                <div class="flash {% if category == 'success' %}flash-success{% endif %}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <div class="nav">
        <a href="/" class="{% if request.path == '/' %}active{% endif %}">🏠</a>
        <a href="/friends" class="{% if request.path == '/friends' %}active{% endif %}">👥</a>
        <a href="/profile" class="{% if request.path == '/profile' %}active{% endif %}">👤</a>
    </div>
</body>
</html>
