<!DOCTYPE html>
<html>
<head>
    <title>Komits - {% block title %}{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --bg-input: #1a1a2e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent: #667eea;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --border-color: #2a2a4a;
            --shadow: 0 4px 20px rgba(102, 126, 234, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); padding: 16px; padding-bottom: 80px; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background: var(--accent-gradient); color: white; padding: 16px 20px; border-radius: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
        .header a { color: white; text-decoration: none; margin-left: 15px; opacity: 0.9; }
        .header a:hover { opacity: 1; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .btn { background: var(--accent-gradient); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 8px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4); }
        .btn:active { transform: scale(0.95); }
        .btn-danger { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
        input, textarea, select { width: 100%; padding: 12px 16px; background: var(--bg-input); border: 2px solid var(--border-color); border-radius: 12px; color: var(--text-primary); font-size: 16px; transition: border-color 0.3s; font-family: inherit; }
        input:focus, textarea:focus { border-color: var(--accent); outline: none; }
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; }
        .file-upload-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .file-upload-btn { background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-primary); padding: 10px 20px; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s; }
        .file-upload-btn:hover { border-color: var(--accent); background: var(--bg-card); }
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-secondary); display: flex; justify-content: space-around; padding: 12px 16px; border-top: 1px solid var(--border-color); backdrop-filter: blur(10px); }
        .nav a { text-decoration: none; color: var(--text-secondary); font-size: 24px; padding: 8px 16px; border-radius: 12px; transition: all 0.3s; }
        .nav a:hover { color: var(--text-primary); }
        .nav a.active { color: var(--accent); background: rgba(102, 126, 234, 0.15); }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 16px; margin: 8px 0; word-wrap: break-word; }
        .message-sent { background: var(--accent-gradient); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message-received { background: var(--bg-secondary); color: var(--text-primary); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border-color); }
        .message-time { font-size: 11px; opacity: 0.7; margin-top: 4px; }
        .flash { background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: white; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; text-align: center; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease; }
        details summary { list-style: none; }
        details summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
        
        <div style="height: 70px;"></div>
    </div>

    <div class="nav">
        <a href="/" class="{% if request.path == '/' %}active{% endif %}"><i class="fas fa-home"></i></a>
        <a href="/chats" class="{% if request.path == '/chats' %}active{% endif %}"><i class="fas fa-comments"></i></a>
        <a href="/friends" class="{% if request.path == '/friends' %}active{% endif %}"><i class="fas fa-user-friends"></i></a>
        <a href="/communities" class="{% if request.path == '/communities' %}active{% endif %}"><i class="fas fa-globe"></i></a>
        <a href="/leaderboard" class="{% if request.path == '/leaderboard' %}active{% endif %}"><i class="fas fa-trophy"></i></a>
        <a href="/profile" class="{% if request.path == '/profile' %}active{% endif %}"><i class="fas fa-user"></i></a>
    </div>
</body>
</html>
