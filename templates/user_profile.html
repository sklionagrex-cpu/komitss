{% extends "base.html" %}
{% block title %}Профиль{% endblock %}
{% block content %}
<div class="header">
    <h2><i class="fas fa-user"></i> Профиль</h2>
    <a href="/"><i class="fas fa-home"></i></a>
</div>

<div class="card" style="text-align: center; padding: 30px;">
    <div style="width: 100px; height: 100px; border-radius: 50%; background: var(--accent-gradient); 
                margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; 
                font-size: 40px; color: white; font-weight: bold;">
        {{ user[1][0].upper() }}
    </div>
    <h2>{{ user[1] }}</h2>
    <p style="color: var(--text-secondary); margin: 8px 0 20px;">
        {{ user[3] or 'Пользователь Komits' }}
    </p>
    {% if user[4] %}
    <p style="color: var(--text-secondary); font-size: 14px;">
        <i class="fas fa-calendar-alt"></i> Присоединился: {{ user[4][:10] }}
    </p>
    {% endif %}
</div>

<div class="card" style="text-align: center;">
    <form method="POST" action="/create_chat">
        <input type="hidden" name="type" value="private">
        <input type="hidden" name="user_id" value="{{ user[0] }}">
        <button type="submit" class="btn" style="width: 100%;">
            <i class="fas fa-comment"></i> Написать сообщение
        </button>
    </form>
</div>
{% endblock %}
