{% extends "base.html" %}
{% block content %}
<div class="header">
    <h2><i class="fas fa-comments"></i> Чаты</h2>
    <div class="header-actions">
        <a href="/friends"><i class="fas fa-user-plus"></i></a>
    </div>
</div>
{% if chats %}
    {% for chat in chats %}
    <a href="/chat/{{ chat[0] }}" style="text-decoration:none;display:block">
        <div class="card" style="cursor:pointer">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <div style="display:flex;align-items:center;gap:12px">
                    <div class="avatar avatar-sm">
                        <i class="fas fa-user"></i>
                    </div>
                    <div>
                        <div style="font-weight:600">
                            Чат #{{ chat[0] }}
                            {% if chat[4] > 0 %}
                            <span style="background:#e74c3c;color:white;padding:2px 8px;border-radius:10px;font-size:12px">{{ chat[4] }}</span>
                            {% endif %}
                        </div>
                    </div>
                </div>
                <span style="color:var(--text-muted)"><i class="fas fa-chevron-right"></i></span>
            </div>
        </div>
    </a>
    {% endfor %}
{% else %}
<div class="card" style="text-align:center;padding:40px">
    <i class="fas fa-comments" style="font-size:48px;color:var(--text-muted)"></i>
    <p style="margin-top:16px;color:var(--text-muted)">Нет чатов</p>
    <p style="font-size:14px;color:var(--text-muted)">Добавьте друзей и начните общение</p>
</div>
{% endif %}
{% endblock %}
